<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Summary | MotivaQuiz</title>
    <link rel="stylesheet" href="quizsummary.css">
</head>
<body>
    <header class="act-header">
        <button onclick="goToHome()" class="back-btn">⬅ RETURN TO HQ</button>
        <div class="logo-text">ACT PERFORMANCE LOG</div>
    </header>

    <div class="summary-container">
        <div class="stats-panel texture-bg">
            <div class="stat-box">
                <h3>CANDIDATE</h3>
                <h2 id="sumName" style="color: var(--act-gold);">LOADING...</h2>
            </div>
            <div class="stat-box">
                <h3>TOTAL SYSTEM POINTS</h3>
                <h2 id="sumPoints">0</h2>
            </div>
            <div class="stat-box">
                <h3>CURRENT RANK</h3>
                <h2 id="sumRank">EVALUATING...</h2>
            </div>
        </div>

        <h2 class="section-title">MODULE DIAGNOSTICS</h2>
        <div class="module-grid" id="moduleGrid">
            </div>
    </div>

    <footer class="act-footer">
        <p><strong>ASIAN COLLEGE OF TECHNOLOGY – BULACAO CAMPUS</strong></p>
        <p class="sub-footer">MOTIVAQUIZ ICT SYSTEM • STRICTLY FOR EDUCATIONAL EVALUATION • SECURE CONNECTION</p>
    </footer>

    <script src="quizsummary.js"></script>
</body>
</html>
