<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACT Student Profile | MotivaQuiz</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <header class="act-header">
    <button onclick="goToHome()" class="back-btn">⬅ BACK TO MISSION CONTROL</button>
    <div class="logo-text">ACT PROFILE SECTOR</div>
    </header>   

    <div class="profile-container">
        <div class="id-card">
            <div class="id-texture"></div> <div class="user-info">
                <div class="avatar-circle">🎓</div>
                <div class="text-data">
                    <h1 id="profName">LOADING...</h1>
                    <p class="rank-tag" id="profRank">CANDIDATE</p>
                    <p class="campus">ACT - BULACAO CAMPUS</p>
                </div>
            </div>
            <div class="id-footer">
                <div class="stat-item">
                    <span class="label">TOTAL SCORE</span>
                    <span class="value" id="profPoints">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">GLOBAL PROGRESS</span>
                    <span class="value" id="profPercent">0%</span>
                </div>
            </div>
        </div>

        <div class="section-title">COURSE PROGRESSION</div>
        <div class="progress-grid" id="lessonTracker">
            </div>

        <div class="section-title">ACHIEVEMENT BADGES</div>
        <div class="badge-vault" id="badgeVault">
            <div class="badge locked" id="badge1">🔌<br><small>Hardware</small></div>
            <div class="badge locked" id="badge2">💿<br><small>Software</small></div>
            <div class="badge locked" id="badge3">🌐<br><small>Network</small></div>
            <div class="badge locked" id="badge4">🔧<br><small>Repair</small></div>
            <div class="badge locked" id="badge5">🎨<br><small>Animator</small></div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
